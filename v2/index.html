<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>מקורבים - בדיקת V2</title><style>.kitchen,.kitchen *{font-family:Arial,"Noto Sans Hebrew",sans-serif!important;box-sizing:border-box}.kitchen{direction:rtl;color:#292725;max-width:900px;margin:auto;padding:24px;background:#fbfaf9}.kitchen h1{font-size:28px}.kitchen h2{font-size:21px}.kitchen h3{font-size:17px}.kitchen .muted{font-size:14px;color:#696561}.kitchen .card{border:1px solid #e2dfdc;border-radius:12px;padding:18px;margin:20px 0}.kitchen button{cursor:pointer;min-height:44px;background:#fff;border:1px solid #e2dfdc;border-radius:6px;padding:10px 14px;color:inherit;font-size:15px}.kitchen .card>button{display:block;width:100%;margin:7px 0}.kitchen button.selected{background:#72a89b;color:white}.kitchen .tabs,.kitchen .actions,.kitchen .reactions{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.kitchen .post{white-space:pre-wrap;overflow-wrap:anywhere}.kitchen label{display:block;margin:16px 0}.kitchen input,.kitchen textarea{display:block;width:100%;font-size:16px;padding:12px;border:1px solid #d8d4d0;border-radius:6px;margin-top:8px}.kitchen .check{display:flex;gap:12px;align-items:center}.kitchen .check input{width:auto;margin:0}.kitchen aside{border-right:3px solid #72a89b;padding:12px;color:#696561}.kitchen .error{color:#9c3829}.kitchen button:disabled{opacity:.5}.kitchen button:focus-visible{outline:2px solid #306858;outline-offset:3px}
</style></head><body><div id="root" class="kitchen"></div><script type="module">class KitchenApi {
 constructor(endpoint,transport=fetch){this.endpoint=endpoint;this.transport=(...args)=>transport(...args);this.token=null;this.state=null;this.busy=false;}
 async login(token){this.token=token;try{return await this.read();}catch(e){this.token=null;this.state=null;throw e;}}
 logout(){this.token=null;this.state=null;}
 async call(body){
  if(!this.token)throw Error('unauthorized');
  const response=await this.transport(this.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,token:this.token}),cache:'no-store',redirect:'follow'});
  if(!response.ok)throw Error('network');const result=await response.json();if(!result.ok)throw Error(result.error||'server');
  if(result.schemaVersion!==2)throw Error('wrong_version');this.state=result;return result;
 }
 async read(){return this.call({a:'state'});}
 async write(body){
  if(this.busy)throw Error('busy');if(!this.state)throw Error('not_loaded');this.busy=true;
  try{return await this.call({...body,revision:this.state.revision});}finally{this.busy=false;}
 }
}


function mountKitchen(root,api,options={}){
 let personalLink=null,period=null,date=null,view=null,edit=null,selected=[],notice='',error='',pending=false;
 const el=(tag,text,attrs={},children=[])=>{const e=document.createElement(tag);if(text!==null)e.textContent=text;for(const [k,v] of Object.entries(attrs)){if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v);}children.forEach(c=>e.append(c));return e;};
 const button=(text,fn,on=false)=>el('button',text,{onclick:fn,class:on?'selected':'',type:'button',disabled:pending});
 const field=(label,value,type='text')=>{const input=el(type==='textarea'?'textarea':'input',null,{value,type:type==='textarea'?null:type});input.value=value||'';return {node:el('label',label,{},[input]),input};};
 const name=id=>api.state.data.people.find(p=>p.id===id)?.name||'שם לא זמין';
 const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric'});
 async function write(b){pending=true;error='';render();try{const result=await api.write(b);if(result.personalLink)personalLink=result.personalLink;edit=null;notice=options.demo?'נשמר רק בבדיקת ההדגמה, לא בשרת חי.':'נשמר בשרת.';}catch(e){error=e.message==='conflict'?'הלוח עודכן בינתיים. רענני ובחרי שוב.':'השינוי לא נשמר. '+e.message;}finally{pending=false;render();}}
 function belongs(id){const d=api.state.data;return d.attendance.some(a=>a.personId===id&&a.period===period)||d.assignments.some(a=>a.personId===id&&a.period===period);}
 function eligible(id,slot){const d=api.state.data,p=d.people.find(p=>p.id===id);if(!belongs(id))return false;if(d.assignments.some(a=>a.personId===id&&a.date===date&&!(a.period===period&&a.shift===slot)))return false;const bounds=(d.noteCategories?.availability||[]).find(n=>n.name===p.name)?.items.filter(n=>n.period===period&&n.from&&n.to)||[];return (!bounds.length||bounds.some(n=>date>=n.from&&date<=n.to))&&!(p.availability?.unavailableDates||[]).includes(date);}
 function shiftCard(slot,records,coord){
  const c=el('section',null,{class:'card'},[el('h2',slot.name),el('p',slot.hours||'',{class:'muted'})]);records.forEach(a=>c.append(el('p',name(a.personId))));if(!records.length)c.append(el('p','אין שיבוצים',{class:'muted'}));
  if(coord)c.append(button(edit===slot.id?'העריכה פתוחה כאן':'עריכת שיבוץ',()=>{edit=slot.id;selected=records.map(a=>a.personId);notice='';render();}));
  if(coord&&edit===slot.id){c.append(el('h3','נבחרו למשמרת'),el('p','לחצי על שם מסומן להסרה.',{class:'muted'}));selected.forEach(id=>c.append(button(name(id),()=>{selected=selected.filter(x=>x!==id);render();},true)));c.append(el('h3','אפשר לשבץ'),el('p','מאותה תקופה, פנויים ביום הזה. לחצי על שם לבחירה.',{class:'muted'}));api.state.data.people.filter(p=>!selected.includes(p.id)&&eligible(p.id,slot.id)).sort((a,b)=>a.name.localeCompare(b.name,'he')).forEach(p=>c.append(button(p.name,()=>{selected.push(p.id);render();})));c.append(el('div',null,{class:'actions'},[button(options.demo?'שמירה בבדיקה':'שמירה',()=>write({a:'setShift',period,date,slot:slot.id,ids:selected}),true),button('ביטול',()=>{edit=null;render();})]));}
  return c;
 }
 function shifts(coord){const d=api.state.data,p=d.periods.find(p=>p.id===period);const body=el('div');body.append(el('nav',null,{class:'tabs'},d.periods.map(p=>button(p.name,()=>{period=p.id;date=p.dates[0];edit=null;render();},p.id===period))));body.append(el('nav',null,{class:'tabs'},p.dates.map(x=>button(fmt(x),()=>{date=x;edit=null;render();},x===date))));const day=d.days.find(x=>x.period===period&&x.date===date);body.append(el('h2',fmt(date)));(day?.roles||[]).forEach(r=>body.append(el('p',r.label+': '+r.value)));const slots=d.shiftDefs.filter(s=>period==='אירוע'?['festival','mpatz'].includes(s.id):!['festival','mpatz'].includes(s.id));slots.forEach(s=>body.append(shiftCard(s,d.assignments.filter(a=>a.period===period&&a.date===date&&a.shift===s.id),coord)));return body;}
 function mine(){const d=api.state.data,list=d.assignments.filter(a=>a.personId===api.state.me).sort((a,b)=>a.date.localeCompare(b.date));const body=el('div',null,{},[el('h2','המשמרות שלי')]);if(!list.length)body.append(el('p','אין כרגע משמרות משויכות אלייך.'));list.forEach(a=>{const slot=d.shiftDefs.find(s=>s.id===a.shift),day=d.days.find(x=>x.period===a.period&&x.date===a.date);body.append(el('section',null,{class:'card'},[el('h3',fmt(a.date)+' · '+a.period),el('p',slot.name+' · '+(slot.hours||'')),...(day?.roles||[]).map(r=>el('p',r.label+': '+r.value))]));});return body;}
 function details(){const d=api.state.data,p=d.people.find(p=>p.id===api.state.me);const body=el('section',null,{class:'card'},[el('h2','הזמינות וההערות שלי'),el('p','שינוי זמינות לא מבטל משמרת קיימת. שיבוצים נערכים רק בידי הרכזים.',{class:'muted'})]);if(!api.state.features.selfUpdate){body.append(el('p','עדכון אישי עדיין לא פעיל.'));return body;}const dates=d.periods.filter(t=>p.periods.includes(t.id)).flatMap(t=>t.dates).filter((v,i,a)=>a.indexOf(v)===i),unavailable=new Set(p.availability?.unavailableDates||[]);body.append(el('p','סמני ימים שבהם לא ניתן להגיע:'));dates.forEach(date=>{const input=el('input',null,{type:'checkbox'});input.checked=unavailable.has(date);input.addEventListener('change',()=>input.checked?unavailable.add(date):unavailable.delete(date));body.append(el('label',fmt(date),{class:'check'},[input]));});const note=field('הערה אישית לרכזים',p.selfNote,'textarea');body.append(note.node,button(options.demo?'שמירה בבדיקה':'שמירה',()=>write({a:'saveMe',unavailableDates:[...unavailable],note:note.input.value}),true));return body;}
 function board(){const body=el('section',null,{},[el('h2','לוח מודעות')]);const input=field('הודעה חדשה','','textarea');body.append(input.node,button('פרסום',()=>write({a:'boardAdd',text:input.input.value}),true));api.state.board.forEach(post=>{const c=el('section',null,{class:'card'},[el('h3',post.author),el('p',new Date(post.at).toLocaleString('he-IL'),{class:'muted'}),el('p',post.text,{class:'post'})]);c.append(el('div',null,{class:'reactions'},['👍','❤️','🙏','😂','🔥','🎉'].map(emoji=>{const r=post.reactions.find(r=>r.emoji===emoji);return button(emoji+(r?.count?' '+r.count:''),()=>write({a:'react',id:post.id,emoji}),r?.mine);})));if(post.own||api.state.role==='coord'&&api.state.features.moderation)c.append(button('מחיקה',()=>{if(confirm('למחוק את ההודעה?'))write({a:'boardDelete',id:post.id});}));body.append(c);});return body;}
 function access(){const body=el('section',null,{},[el('h2','קישורים אישיים'),el('p','הקישור נותן גישה למי שמחזיק בו. יצירת קישור חדש מבטלת את הקודם. אין שליחה אוטומטית.')]);if(personalLink){const p=personalLink;const url=new URL(location.href);url.hash='token='+p.token;const f=field('קישור חדש - שמרי לפני מעבר או רענון',url.href);f.input.readOnly=true;body.append(f.node,button('העתקת קישור',async()=>{try{await navigator.clipboard.writeText(url.href);notice='הקישור הועתק.';}catch(e){notice='בחרי והעתיקי את הקישור מהשדה.';}render();}));}api.state.data.people.forEach(p=>{const accounts=(api.state.accounts||[]).filter(a=>a.personId===p.id),active=accounts.find(a=>!a.revoked),phone=field('טלפון למשלוח ידני',active?.phone||p.phone||'','tel');const card=el('section',null,{class:'card'},[el('h3',p.name),el('p',active?'קישור פעיל עד '+new Date(active.expiresAt).toLocaleDateString('he-IL'):'אין קישור פעיל'),phone.node,button(active?'יצירת קישור חדש וביטול הקודם':'יצירת קישור',()=>{if(!active||confirm('ליצור קישור חדש ולבטל את הקודם?'))write({a:'createLink',personId:p.id,phone:phone.input.value});})]);if(active)card.append(button('ביטול גישה',()=>{if(confirm('לבטל את כל הקישורים של '+p.name+'?'))write({a:'revokeLink',personId:p.id});}));body.append(card);});return body;}
 function login(){const box=el('section',null,{class:'card'},[el('h2','כניסה אישית'),el('p','בדיקה פרטית עם נתוני המשמרות שנבדקו. לא נשלח דבר לאיש.')]);const token=field('קישור או מפתח בדיקה','','password');box.append(token.node,button('כניסה לבדיקה',async()=>{pending=true;error='';try{let t=token.input.value.trim();if(t.startsWith('https://'))t=new URL(t).hash.replace(/^#token=/,'');await api.login(t);view=api.state.role==='coord'?'shifts':'mine';}catch(e){error='הכניסה לא הצליחה: '+e.message;}finally{pending=false;render();}}));return box;}
 function render(){root.replaceChildren();root.append(el('header',null,{},[el('h1','מקורבים'),el('p',options.demo?'בדיקת V2 פרטית · נתונים מלאכותיים':'משמרות קמפ המטבח')]));if(options.demo)root.append(el('aside','הדגמה נפרדת. השמירה כאן אינה שמירה לשרת חי. לא נשלח דבר לאיש.'));if(options.staging)root.append(el('aside','סביבת בדיקה נפרדת · נתוני המשמרות שנבדקו. שינויים נשמרים בגיליון הבדיקה בלבד.'));if(!api.state){root.append(login());if(error)root.append(el('p',error,{role:'alert'}));return;}const d=api.state.data;period=period||d.periods[0].id;date=date||d.periods[0].dates[0];const coord=api.state.role==='coord';view=view||(coord?'shifts':'mine');root.append(el('nav',null,{class:'tabs'},(coord?[['shifts','לוח משמרות'],['mine','המשמרות שלי'],['board','לוח מודעות'],['access','קישורים אישיים']]:[['mine','המשמרות שלי'],['shifts','כל המשמרות'],['board','לוח מודעות'],['details','הזמינות שלי']]).map(([id,label])=>button(label,()=>{view=id;edit=null;notice='';render();},view===id))));root.append(button('רענון מהשרת',async()=>{try{await api.read();error='';notice='עודכן מהשרת.';}catch(e){error='הרענון נכשל: '+e.message;}render();}));root.append(button('יציאה',()=>{api.logout();personalLink=null;period=date=null;edit=null;render();}));if(error)root.append(el('p',error,{role:'alert',class:'error'}));if(notice)root.append(el('p',notice,{role:'status'}));root.append(view==='access'?access():view==='board'?board():view==='mine'?mine():view==='details'?details():shifts(coord));}
 render();return {render,destroy:()=>root.replaceChildren()};
}

const endpoint='https://script.google.com/macros/s/AKfycby1RC5g5p09dON2DgnSAaecOLRF7OASqWWy4UTpo_prtz9l8Sx2eX4D3wFBxElEck0R/exec';
const api=new KitchenApi(endpoint),ui=mountKitchen(document.getElementById('root'),api,{staging:true});
const raw=location.hash.replace(/^#token=/,'');
if(/^[a-f0-9]{64}$/.test(raw)){history.replaceState(null,'',location.pathname+location.search);api.login(raw).then(()=>ui.render()).catch(()=>ui.render());}</script></body></html>
